<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Equipos</title>
<style>
  :root{
    --bg:#0f1720;
    --panel:#151f2b;
    --panel-2:#1b2733;
    --border:#263241;
    --text:#e6edf3;
    --muted:#8b9bab;
    --accent:#3aa6a6;
    --accent-2:#4f7cff;
    --ok:#3ecf8e;
    --warn:#e0a13b;
    --bad:#e05a5a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:22px 28px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    background:linear-gradient(180deg,#121a24,#0f1720);
  }
  header h1{
    margin:0;
    font-size:1.35rem;
    letter-spacing:.3px;
  }
  header .sub{color:var(--muted); font-size:.85rem; margin-top:2px;}
  .header-actions{display:flex; gap:10px; flex-wrap:wrap;}
  main{padding:24px 28px; max-width:1400px; margin:0 auto;}

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat-card .num{font-size:1.6rem; font-weight:700;}
  .stat-card .lbl{color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.5px;}

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px;
  }
  .toolbar input[type=text], .toolbar select{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:8px;
    font-size:.88rem;
  }
  .toolbar input[type=text]{flex:1; min-width:180px;}
  .spacer{flex:1;}

  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:9px 14px;
    font-size:.85rem;
    font-weight:600;
    transition:filter .15s ease;
  }
  button:hover{filter:brightness(1.12);}
  .btn-primary{background:var(--accent-2); color:#fff;}
  .btn-secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--border);}
  .btn-ok{background:var(--ok); color:#04241a;}
  .btn-danger{background:transparent; color:var(--bad); border:1px solid var(--bad);}
  .btn-small{padding:5px 9px; font-size:.75rem;}

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:.87rem;
  }
  thead{background:var(--panel-2);}
  th, td{
    padding:10px 12px;
    text-align:left;
    border-bottom:1px solid var(--border);
    vertical-align:top;
  }
  tbody tr:hover{background:#1a2531;}
  .tag{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:.72rem;
    font-weight:600;
  }
  .tag-activo{background:rgba(62,207,142,.15); color:var(--ok);}
  .tag-mantenimiento{background:rgba(224,161,59,.15); color:var(--warn);}
  .tag-baja{background:rgba(224,90,90,.15); color:var(--bad);}
  .tag-bodega{background:rgba(79,124,255,.15); color:var(--accent-2);}
  .monitor-pill{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--border);
    padding:1px 7px;
    border-radius:6px;
    font-size:.72rem;
    margin:1px 3px 1px 0;
    color:var(--muted);
  }
  .actions-cell{white-space:nowrap;}
  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    width:100%;
    max-width:560px;
    padding:22px;
  }
  .modal h2{margin-top:0; font-size:1.1rem;}
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .form-grid .full{grid-column:1/-1;}
  label{
    display:block;
    font-size:.78rem;
    color:var(--muted);
    margin-bottom:4px;
  }
  input[type=text], input[type=date], select, input[type=number]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:8px;
    font-size:.88rem;
  }
  fieldset{
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    margin-top:6px;
  }
  legend{padding:0 6px; font-size:.8rem; color:var(--muted);}
  .monitor-block{
    border:1px dashed var(--border);
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
  }
  .monitor-block-header{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
  }
  .hint{
    font-size:.78rem;
    color:var(--muted);
    margin-top:14px;
    line-height:1.4;
  }
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    width:100%;
    max-width:360px;
  }
  .login-box h1{font-size:1.2rem; margin-top:0;}
  .login-box label{margin-top:10px;}
  .login-error{
    color:var(--bad);
    font-size:.82rem;
    margin-top:10px;
    min-height:1.2em;
  }
  #appRoot{display:none;}
  .status-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--ok);
    margin-right:6px;
  }
  .status-dot.off{background:var(--bad);}
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .tab-btn{
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--muted);
    padding:10px 6px;
    font-size:.9rem;
    font-weight:600;
    border-radius:0;
  }
  .tab-btn:hover{filter:none; color:var(--text);}
  .tab-btn.active{color:var(--text); border-bottom-color:var(--accent-2);}
  .tab-section[hidden]{display:none;}
  @media (max-width:640px){
    .form-grid{grid-template-columns:1fr;}
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tbody tr{border-bottom:1px solid var(--border); padding:8px 0;}
    td{border:none; padding:4px 0;}
    td::before{content:attr(data-label); display:block; font-size:.7rem; color:var(--muted); text-transform:uppercase;}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <button class="btn-secondary btn-small" id="btnLimpiarMon">Limpiar filtros</button>

  <div id="tableWrapMon"></div>

  <section id="section-impresoras" class="tab-section" hidden>

  <div class="toolbar">
    <input type="text" id="fBuscarImp" placeholder="Buscar por serial, marca, modelo...">
    <select id="fSedeImp"><option value="">Todas las sedes</option></select>
    <select id="fEstadoImp">
      <option value="">Todos los estados</option>
      <option value="Activa">Activa</option>
      <option value="En mantenimiento">En mantenimiento</option>
      <option value="En bodega">En bodega</option>
      <option value="Dado de baja">Dado de baja</option>

    <div class="spacer"></div>
    <button class="btn-secondary btn-small" id="btnLimpiarImp">Limpiar filtros</button>
  </div>

  <div id="tableWrapImp"></div>
  </section>
</main>

<script>
// ============ CONFIGURACIÓN DE FIREBASE ============
// Reemplaza estos valores por los de tu proyecto en Firebase Console
// (Configuración del proyecto → Tus apps → Config del SDK)
const firebaseConfig = {
  apiKey: "AIzaSyCzabPdUqyrfhjVQYZwFCj6hWpHTLe__G8",
  authDomain: "inventario-ptmg.firebaseapp.com",
  projectId: "inventario-ptmg",
  storageBucket: "inventario-ptmg.firebasestorage.app",
  messagingSenderId: "548041876559",
  appId: "1:548041876559:web:1bd8815d958b911fae763a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const equiposRef = db.collection('equipos');
const monitoresRef = db.collection('monitores_stock');
const impresorasRef = db.collection('impresoras');
// ====================================================

let equipos = [];
let monitoresStock = [];
let impresoras = [];
let activeTab = 'equipos';
let unsubscribeSnapshot = null;
let unsubscribeMon = null;
let unsubscribeImp = null;

function uid(){
  return 'eq_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

// ---------- Pestañas ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b===btn));
    document.getElementById('section-equipos').hidden = activeTab !== 'equipos';
    document.getElementById('section-monitores').hidden = activeTab !== 'monitores';
    document.getElementById('section-impresoras').hidden = activeTab !== 'impresoras';
    const btnNuevo = document.getElementById('btnNuevo');
    if(activeTab === 'equipos') btnNuevo.textContent = '+ Nuevo equipo';
    else if(activeTab === 'monitores') btnNuevo.textContent = '+ Nuevo monitor';
    else btnNuevo.textContent = '+ Nueva impresora';
  });
});

// ---------- Login ----------
const loginScreen = document.getElementById('loginScreen');
const appRoot = document.getElementById('appRoot');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');

loginForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  loginError.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  auth.signInWithEmailAndPassword(email, password)
    .catch(err=>{
      loginError.textContent = 'Correo o contraseña incorrectos.';
    });
});

document.getElementById('btnLogout').addEventListener('click', ()=>{
  auth.signOut();
});

auth.onAuthStateChanged(user=>{
  if(user){
    loginScreen.style.display = 'none';
    appRoot.style.display = 'block';
    escucharCambios();
    escucharMonitores();
    escucharImpresoras();
  } else {
    loginScreen.style.display = 'flex';
    appRoot.style.display = 'none';
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    if(unsubscribeMon){ unsubscribeMon(); unsubscribeMon = null; }
    if(unsubscribeImp){ unsubscribeImp(); unsubscribeImp = null; }
    equipos = []; monitoresStock = []; impresoras = [];
  }
});

// ---------- Datos en tiempo real desde Firestore ----------
function escucharCambios(){
  if(unsubscribeSnapshot) return;
  const syncDot = document.getElementById('syncDot');
  const syncLabel = document.getElementById('syncLabel');
  unsubscribeSnapshot = equiposRef.onSnapshot(
    (snapshot)=>{
      equipos = snapshot.docs.map(d=> ({ id: d.id, ...d.data() }));
      syncDot.classList.remove('off');
      syncLabel.textContent = 'Conectado';
      renderAll();
    },
    (error)=>{
      syncDot.classList.add('off');
      syncLabel.textContent = 'Sin conexión con la base de datos';
      console.error(error);
    }
  );
}

async function guardarEquipoEnDB(equipo){

function escapeAttr(str){
  return (str||'').replace(/"/g,'&quot;');

function escapeHtml(str){
  const div = document.createElement('div');

}

  fSede.innerHTML = '<option value="">Todas las sedes</option>' + sedes.map(s=>`<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');
  document.getElementById('listaSedes').innerHTML = sedes.map(s=>`<option value="${escapeAttr(s)}">`).join('');

function filtrarEquipos(){
  const texto = fBuscar.value.toLowerCase();
  return equipos.filter(e=>{
    if(fSede.value && e.sede !== fSede.value) return false;
    if(fTipo.value && e.tipo !== fTipo.value) return false;
    if(fEstado.value && e.estado !== fEstado.value) return false;
    if(texto){
      const blob = [e.marca,e.modelo,e.serial,e.usuario,e.placa,e.area].join(' ').toLowerCase();
      if(!blob.includes(texto)) return false;
    }
    return true;
  });

  }[estado] || 'tag-activo';
}

  }
  const filas = lista.map(e=>{
    const monitores = (e.monitores||[]).map((m,i)=>`<span class="monitor-pill">M${i+1}: ${escapeHtml(m.marca)} ${escapeHtml(m.modelo)}${m.serial ? ' · '+escapeHtml(m.serial):''}</span>`).join(' ') || '<span style="color:var(--muted)">—</span>';
    return `
      <tr>
        <td data-label="Tipo">${escapeHtml(e.tipo)}</td>
        <td data-label="Marca/Modelo"><strong>${escapeHtml(e.marca)}</strong> ${escapeHtml(e.modelo)}<br><span style="color:var(--muted); font-size:.78rem;">S/N: ${escapeHtml(e.serial)}${e.placa? ' · Placa: '+escapeHtml(e.placa):''}</span></td>

  wrap.innerHTML = `

    <div class="stat-card"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>

    ['Activas', activas],
    ['En mantenimiento', mantenimiento],
    ['Sedes registradas', sedes],
  ];
  document.getElementById('statsImp').innerHTML = cards.map(([lbl,num])=>`
    <div class="stat-card"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>
  `).join('');
}
function renderAllImp(){
  actualizarSelectSedesImp();
  renderStatsImp();
  renderTablaImp();
}

// ---------- Exportar / Importar ----------
document.getElementById('btnExport').addEventListener('click', ()=>{
  const datos = activeTab === 'equipos' ? equipos : activeTab === 'monitores' ? monitoresStock : impresoras;
  const nombre = activeTab === 'equipos' ? 'inventario_equipos' : activeTab === 'monitores' ? 'inventario_monitores' : 'inventario_impresoras';
  const blob = new Blob([JSON.stringify(datos, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${nombre}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btnExportCsv').addEventListener('click', ()=>{
  if(activeTab === 'equipos'){
    const headers = ['Tipo','Marca','Modelo','Serial','Placa','Sede','Area','Usuario','Estado','Observaciones','Monitor1_Marca','Monitor1_Modelo','Monitor1_Serial','Monitor2_Marca','Monitor2_Modelo','Monitor2_Serial'];
    const filas = equipos.map(e=>{
      const m1 = (e.monitores && e.monitores[0]) || {};
      const m2 = (e.monitores && e.monitores[1]) || {};
      return [e.tipo,e.marca,e.modelo,e.serial,e.placa,e.sede,e.area,e.usuario,e.estado,e.observaciones,
        m1.marca||'', m1.modelo||'', m1.serial||'', m2.marca||'', m2.modelo||'', m2.serial||''
      ].map(v=> `"${String(v||'').replace(/"/g,'""')}"`).join(',');
    });
    descargarCsv(headers, filas, 'inventario_equipos');
  } else if(activeTab === 'monitores'){
    const headers = ['Marca','Modelo','Serial','Sede','Area','Estado','Observaciones'];
    const filas = monitoresStock.map(m=> [m.marca,m.modelo,m.serial,m.sede,m.area,m.estado,m.observaciones]
      .map(v=> `"${String(v||'').replace(/"/g,'""')}"`).join(','));
    descargarCsv(headers, filas, 'inventario_monitores');
  } else {
    const headers = ['Tipo','Marca','Modelo','Serial','Sede','Area','Usuario','Estado','Observaciones'];
    const filas = impresoras.map(p=> [p.tipo,p.marca,p.modelo,p.serial,p.sede,p.area,p.usuario,p.estado,p.observaciones]
      .map(v=> `"${String(v||'').replace(/"/g,'""')}"`).join(','));
    descargarCsv(headers, filas, 'inventario_impresoras');
  }
});
function descargarCsv(headers, filas, nombre){
  const csv = [headers.join(','), ...filas].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${nombre}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('btnImportTrigger').addEventListener('click', ()=>{
  document.getElementById('fileImport').click();
});
document.getElementById('fileImport').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const datos = JSON.parse(ev.target.result);
      if(!Array.isArray(datos)) throw new Error('Formato inválido');

      const ref = activeTab === 'equipos' ? equiposRef : activeTab === 'monitores' ? monitoresRef : impresorasRef;
      const nombre = activeTab === 'equipos' ? 'equipos' : activeTab === 'monitores' ? 'monitores' : 'impresoras';

      const reemplazar = confirm(`Se encontraron ${datos.length} registros de ${nombre} en el archivo. ¿Reemplazar el inventario actual de esta pestaña? (Cancelar para combinar en lugar de reemplazar)`);

      if(reemplazar){
        const actuales = await ref.get();
        const batchDelete = db.batch();
        actuales.forEach(doc=> batchDelete.delete(doc.ref));
        await batchDelete.commit();
      }

      const batchWrite = db.batch();
      datos.forEach(d=>{
        const id = d.id || uid();
        const { id: _omit, ...resto } = d;
        batchWrite.set(ref.doc(id), resto, { merge: !reemplazar });
      });
      await batchWrite.commit();
      alert('Importación completada.');
    }catch(err){
      alert('No se pudo leer o subir el archivo. Verifica que sea un JSON exportado desde esta misma herramienta.');
      console.error(err);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
